<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Evidence Agent</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            surface: '#F8F9FA',
            panel: '#FFFFFF',
            border: '#E2E8F0',
            muted: '#64748B',
            supported: { bg: '#ECFDF5', border: '#10B981', text: '#065F46' },
            unsupported: { bg: '#FEF2F2', border: '#EF4444', text: '#991B1B' },
            murky: { bg: '#FFFBEB', border: '#F59E0B', text: '#92400E' },
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    .sidebar { transition: transform 0.3s ease; }
    .sidebar.closed { transform: translateX(-100%); }
    .sources-panel { transition: transform 0.3s ease; }
    .sources-panel.closed { transform: translateX(100%); }
    .voice-option { cursor: pointer; transition: all 0.15s; }
    .voice-option:hover { background: #E2E8F0; }
    .voice-option.active { border-color: #3B82F6; background: #EFF6FF; }
  </style>
</head>
<body class="bg-surface text-gray-900 min-h-screen overflow-x-hidden">

  <!-- LEFT SIDEBAR — History -->
  <div id="sidebar" class="sidebar closed fixed left-0 top-0 h-full w-96 bg-panel border-r border-border z-40 flex flex-col shadow-xl">
    <div class="flex items-center justify-between p-4 border-b border-border">
      <h2 class="text-sm font-bold text-gray-700">History</h2>
      <button onclick="toggleSidebar()" class="text-gray-400 hover:text-gray-700 text-lg">&times;</button>
    </div>
    <div id="sidebarHistory" class="flex-1 overflow-y-auto p-3 space-y-2"></div>
  </div>

  <!-- RIGHT PANEL — Sources (desktop: side panel, mobile: inline below) -->
  <div id="sourcesPanel" class="sources-panel closed fixed right-0 top-0 h-full w-[420px] bg-panel border-l border-border z-40 flex-col shadow-xl hidden md:flex">
    <div class="flex items-center justify-between p-4 border-b border-border">
      <h2 class="text-sm font-bold text-gray-700">Sources</h2>
      <button onclick="toggleSources()" class="text-gray-400 hover:text-gray-700 text-lg">&times;</button>
    </div>
    <div id="sourcePanelCards" class="flex-1 overflow-y-auto p-3 space-y-3"></div>
  </div>

  <!-- Overlay -->
  <div id="overlay" class="hidden fixed inset-0 bg-black/30 z-30" onclick="closeAllPanels()"></div>

  <!-- MAIN CONTENT -->
  <div class="max-w-3xl mx-auto px-4 py-10">
    <!-- Top bar -->
    <div class="flex items-center justify-between mb-8">
      <button onclick="toggleSidebar()" class="text-muted hover:text-gray-700 text-sm flex items-center gap-1.5" aria-label="Open history">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        History
      </button>
      <div class="text-center">
        <h1 class="text-3xl font-extrabold tracking-tight text-gray-900">Evidence Agent</h1>
        <p class="text-muted text-sm">Voice-first claim verification</p>
      </div>
      <button onclick="toggleSources()" class="text-muted hover:text-gray-700 text-sm items-center gap-1.5 hidden md:flex" aria-label="Open sources">
        Sources
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path d="M9 5l7 7-7 7"/></svg>
      </button>
      <div class="md:hidden w-16"></div>
    </div>

    <!-- Input area -->
    <div class="flex flex-col items-center gap-4 mb-10">
      <div class="relative w-full">
        <input
          id="claimInput"
          type="text"
          placeholder="Enter a claim to verify..."
          class="w-full bg-panel border border-border rounded-xl px-5 py-4 text-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors pr-14 text-gray-900 placeholder-gray-400"
          aria-label="Claim to verify"
        />
        <button
          id="micBtn"
          title="Push to talk"
          aria-label="Voice input"
          class="mic-btn absolute right-3 top-1/2 -translate-y-1/2 w-10 h-10 rounded-full bg-red-500 hover:bg-red-400 flex items-center justify-center transition-all text-white"
        >
          <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
            <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5z"/>
            <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
          </svg>
        </button>
      </div>
      <button
        id="verifyBtn"
        class="bg-blue-600 hover:bg-blue-700 font-semibold text-lg px-8 py-3 rounded-xl transition-colors w-full sm:w-auto text-white"
      >
        Verify Claim
      </button>
      <!-- Example claims -->
      <div class="flex flex-wrap gap-2 justify-center items-center">
        <span class="text-xs text-muted self-center">Examples to try</span>
        <button onclick="claimInput.value=this.textContent;verify()" class="text-xs text-blue-700 bg-blue-50 border border-blue-200 px-3 py-1 rounded-full hover:bg-blue-100 transition-colors">Coffee prevents heart disease</button>
        <button onclick="claimInput.value=this.textContent;verify()" class="text-xs text-blue-700 bg-blue-50 border border-blue-200 px-3 py-1 rounded-full hover:bg-blue-100 transition-colors">The Great Wall is visible from space</button>
        <button onclick="claimInput.value=this.textContent;verify()" class="text-xs text-blue-700 bg-blue-50 border border-blue-200 px-3 py-1 rounded-full hover:bg-blue-100 transition-colors">Humans only use 10% of their brain</button>
        <button onclick="claimInput.value=this.textContent;verify()" class="text-xs text-amber-700 bg-amber-50 border border-amber-200 px-3 py-1 rounded-full hover:bg-amber-100 transition-colors">Red wine in moderation is good for your heart</button>
        <button onclick="claimInput.value=this.textContent;verify()" class="text-xs text-amber-700 bg-amber-50 border border-amber-200 px-3 py-1 rounded-full hover:bg-amber-100 transition-colors">AI will replace most white-collar jobs within 5 years</button>
        <button onclick="claimInput.value=this.textContent;verify()" class="text-xs text-amber-700 bg-amber-50 border border-amber-200 px-3 py-1 rounded-full hover:bg-amber-100 transition-colors">Intermittent fasting extends lifespan</button>
        <button onclick="claimInput.value=this.textContent;verify()" class="text-xs text-amber-700 bg-amber-50 border border-amber-200 px-3 py-1 rounded-full hover:bg-amber-100 transition-colors">Keto can lower your cholesterol</button>
      </div>
    </div>

    <!-- Status -->
    <div id="status" class="text-center text-muted mb-8 hidden">
      <div class="inline-flex items-center gap-2">
        <svg class="animate-spin w-5 h-5" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
        </svg>
        <span id="statusText">Analyzing claim...</span>
      </div>
    </div>

    <!-- Verdict banner -->
    <div id="verdict" class="hidden mb-8 rounded-2xl p-6 relative border-2 text-center">
      <!-- Top-right: discard (left) and verify another (right) -->
      <div class="absolute top-3 right-3 flex items-center gap-1.5">
        <button onclick="discardClaim()" title="Discard" class="w-8 h-8 rounded-full bg-black/5 hover:bg-red-100 flex items-center justify-center transition-all">
          <svg class="w-4 h-4 text-gray-500 hover:text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
        <button onclick="newClaim()" title="Verify another claim" class="w-8 h-8 rounded-full bg-black/5 hover:bg-blue-100 flex items-center justify-center transition-all">
          <svg class="w-4 h-4 text-gray-500 hover:text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
        </button>
      </div>

      <p id="verdictClaim" class="text-xs text-gray-500 mb-2 italic"></p>
      <div class="text-xs font-medium uppercase tracking-widest mb-1 text-gray-500">Verdict</div>
      <div class="flex items-center justify-center gap-3">
        <div id="verdictLabel" class="text-3xl font-extrabold mb-2"></div>
        <!-- Play/Pause + Speed -->
        <div class="flex items-center gap-1.5 mb-2">
          <button onclick="changeSpeed(-0.25)" title="Slower" class="w-6 h-6 rounded-full bg-black/5 hover:bg-black/10 flex items-center justify-center transition-all">
            <svg class="w-3 h-3 text-gray-500" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9V8h2v8zm4 0h-2V8h2v8z"/></svg>
          </button>
          <button
            id="speakerBtn"
            title="Play / Pause"
            onclick="if(currentAudio){togglePlayPause()}else{speakText(document.getElementById('verdictSummary').dataset.narration)}"
            class="speaker-btn w-10 h-10 rounded-full bg-blue-600 hover:bg-blue-700 flex items-center justify-center transition-all text-white"
          >
            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          </button>
          <button onclick="changeSpeed(0.25)" title="Faster" class="w-6 h-6 rounded-full bg-black/5 hover:bg-black/10 flex items-center justify-center transition-all">
            <svg class="w-3 h-3 text-gray-500" fill="currentColor" viewBox="0 0 24 24"><path d="M4 18l8.5-6L4 6v12zm9-12v12l8.5-6L13 6z"/></svg>
          </button>
          <span id="speedDisplay" class="text-[10px] text-muted ml-0.5">1.0x</span>
        </div>
      </div>
      <div class="flex items-center justify-center gap-2 mb-3">
        <span class="text-sm text-gray-500">Confidence</span>
        <div class="w-32 h-2 bg-black/10 rounded-full overflow-hidden">
          <div id="confidenceBar" class="h-full rounded-full transition-all duration-700"></div>
        </div>
        <span id="confidenceNum" class="text-sm font-semibold"></span>
      </div>
      <p id="verdictSummary" class="text-sm text-gray-600 max-w-xl mx-auto mb-4"></p>

      <!-- Voice selector + powered by -->
      <div class="flex items-center justify-center gap-3 mb-2">
        <span class="text-[10px] text-muted uppercase tracking-wider">Voice:</span>
        <div class="flex gap-1">
          <button onclick="setVoice('rachel','Rachel')" class="voice-option active text-[10px] text-gray-600 px-2 py-1 rounded-md border border-border" id="voice-rachel">Rachel</button>
          <button onclick="setVoice('George','George')" class="voice-option text-[10px] text-gray-600 px-2 py-1 rounded-md border border-border" id="voice-George">George</button>
          <button onclick="setVoice('Josh','Josh')" class="voice-option text-[10px] text-gray-600 px-2 py-1 rounded-md border border-border" id="voice-Josh">Josh</button>
        </div>
      </div>
      <div class="text-center mb-3">
        <span class="text-[10px] text-muted">Powered by</span>
        <span class="text-[10px] text-gray-500 font-semibold ml-1">ElevenLabs</span>
        <span class="text-[10px] text-muted mx-1">&times;</span>
        <span class="text-[10px] text-gray-500 font-semibold">Firecrawl</span>
      </div>

      <!-- Share buttons -->
      <div class="flex flex-wrap items-center justify-center gap-2">
        <button onclick="copyVerdict()" class="text-xs text-gray-600 bg-gray-100 hover:bg-gray-200 px-4 py-2 rounded-lg transition-colors inline-flex items-center gap-1.5 border border-border">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h12a2 2 0 002-2v-2M16 3h5v5M10 14L20.2 3.8"/></svg>
          <span id="shareBtnText">Copy</span>
        </button>
        <button onclick="shareToX()" class="text-xs text-gray-600 bg-gray-100 hover:bg-gray-200 px-4 py-2 rounded-lg transition-colors inline-flex items-center gap-1.5 border border-border">
          <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
          X
        </button>
        <button onclick="shareToLinkedIn()" class="text-xs text-gray-600 bg-gray-100 hover:bg-gray-200 px-4 py-2 rounded-lg transition-colors inline-flex items-center gap-1.5 border border-border">
          <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
          LinkedIn
        </button>
        <button onclick="shareToEmail()" class="text-xs text-gray-600 bg-gray-100 hover:bg-gray-200 px-4 py-2 rounded-lg transition-colors inline-flex items-center gap-1.5 border border-border">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
          Email
        </button>
      </div>
    </div>

    <!-- Follow-up Q&A (BEFORE sources on mobile) -->
    <div id="followup" class="hidden mt-6">
      <h2 class="text-lg font-bold mb-3 text-gray-800">Ask a follow-up</h2>
      <div class="flex gap-2">
        <input
          id="followupInput"
          type="text"
          placeholder="Ask about the evidence..."
          class="flex-1 bg-panel border border-border rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 transition-colors text-gray-900 placeholder-gray-400"
          aria-label="Follow-up question"
        />
        <button
          id="followupBtn"
          onclick="askFollowup()"
          class="bg-blue-600 hover:bg-blue-700 font-semibold text-sm px-5 py-3 rounded-xl transition-colors shrink-0 text-white"
        >Ask</button>
      </div>
      <div id="followupAnswers" class="mt-4 space-y-3"></div>
    </div>

    <!-- Sources (inline on mobile, panel trigger on desktop) -->
    <div id="sources" class="hidden mt-6">
      <!-- Desktop: button to open right panel -->
      <div class="hidden md:block">
        <button onclick="toggleSources()" class="w-full text-left bg-panel border border-border rounded-xl px-5 py-4 hover:border-gray-400 transition-colors">
          <div class="flex items-center justify-between">
            <div>
              <h3 class="text-sm font-bold text-gray-700">Sources Found</h3>
              <p id="sourceCount" class="text-xs text-muted">Click to view details &rarr;</p>
            </div>
            <svg class="w-5 h-5 text-muted" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path d="M9 5l7 7-7 7"/></svg>
          </div>
        </button>
      </div>
      <!-- Mobile: inline source cards -->
      <div class="md:hidden">
        <h2 class="text-lg font-bold mb-3 text-gray-800">Sources</h2>
        <div id="mobileSourceCards" class="space-y-3"></div>
      </div>
    </div>

    <!-- Hidden history (JS compat) -->
    <div id="history" class="hidden" style="display:none!important">
      <div id="historyList"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>

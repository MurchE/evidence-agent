<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Evidence Agent</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-[#0D0D0D] text-white min-h-screen font-[Inter]">
  <div class="max-w-3xl mx-auto px-4 py-12">
    <!-- Header -->
    <div class="text-center mb-12">
      <h1 class="text-4xl font-extrabold tracking-tight mb-2">Evidence Agent</h1>
      <p class="text-gray-400 text-lg">Voice-first claim verification</p>
    </div>

    <!-- Input area -->
    <div class="flex flex-col items-center gap-4 mb-10">
      <div class="relative w-full">
        <input
          id="claimInput"
          type="text"
          placeholder="Enter a claim to verify..."
          class="w-full bg-[#1A1A1A] border border-gray-700 rounded-xl px-5 py-4 text-lg focus:outline-none focus:border-blue-500 transition-colors pr-14"
        />
        <button
          id="micBtn"
          title="Push to talk"
          class="mic-btn absolute right-3 top-1/2 -translate-y-1/2 w-10 h-10 rounded-full bg-red-600 hover:bg-red-500 flex items-center justify-center transition-all"
        >
          <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
            <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5z"/>
            <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
          </svg>
        </button>
      </div>
      <button
        id="verifyBtn"
        class="bg-blue-600 hover:bg-blue-500 font-semibold text-lg px-8 py-3 rounded-xl transition-colors w-full sm:w-auto"
      >
        Verify Claim
      </button>
    </div>

    <!-- Status -->
    <div id="status" class="text-center text-gray-400 mb-8 hidden">
      <div class="inline-flex items-center gap-2">
        <svg class="animate-spin w-5 h-5" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
        </svg>
        <span id="statusText">Analyzing claim...</span>
      </div>
    </div>

    <!-- Verdict banner -->
    <div id="verdict" class="hidden mb-8 rounded-2xl p-6 text-center">
      <div class="text-sm font-medium uppercase tracking-widest mb-1 opacity-70">Verdict</div>
      <div class="flex items-center justify-center gap-3">
        <div id="verdictLabel" class="text-3xl font-extrabold mb-2"></div>
        <button
          id="speakerBtn"
          title="Replay verdict"
          onclick="if(currentAudio){currentAudio.pause();currentAudio=null;this.classList.remove('playing')}else{speakText(document.getElementById('verdictSummary').dataset.narration)}"
          class="speaker-btn w-8 h-8 rounded-full bg-white/10 hover:bg-white/20 flex items-center justify-center transition-all mb-2"
        >
          <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
          </svg>
        </button>
      </div>
      <div class="flex items-center justify-center gap-2 mb-3">
        <span class="text-sm opacity-70">Confidence</span>
        <div class="w-32 h-2 bg-black/20 rounded-full overflow-hidden">
          <div id="confidenceBar" class="h-full rounded-full transition-all duration-700"></div>
        </div>
        <span id="confidenceNum" class="text-sm font-semibold"></span>
      </div>
      <p id="verdictSummary" class="text-sm opacity-80 max-w-xl mx-auto"></p>
    </div>

    <!-- Sources -->
    <div id="sources" class="hidden">
      <h2 class="text-xl font-bold mb-4">Sources</h2>
      <div id="sourceCards" class="space-y-4"></div>
    </div>

    <!-- Claim History -->
    <div id="history" class="mt-12 hidden">
      <h2 class="text-xl font-bold mb-4 text-gray-300">Recent Checks</h2>
      <div id="historyList" class="space-y-2"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>

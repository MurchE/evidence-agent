<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Evidence Agent</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .sidebar { transition: transform 0.3s ease; }
    .sidebar.closed { transform: translateX(-100%); }
    .sources-panel { transition: transform 0.3s ease; }
    .sources-panel.closed { transform: translateX(100%); }
    .voice-option { cursor: pointer; transition: all 0.15s; }
    .voice-option:hover { background: rgba(255,255,255,0.1); }
    .voice-option.active { border-color: #3b82f6; background: rgba(59,130,246,0.1); }
  </style>
</head>
<body class="bg-[#0D0D0D] text-white min-h-screen font-[Inter] overflow-x-hidden">

  <!-- LEFT SIDEBAR — History -->
  <div id="sidebar" class="sidebar closed fixed left-0 top-0 h-full w-72 bg-[#111] border-r border-gray-800 z-40 flex flex-col">
    <div class="flex items-center justify-between p-4 border-b border-gray-800">
      <h2 class="text-sm font-bold text-gray-300">History</h2>
      <button onclick="toggleSidebar()" class="text-gray-500 hover:text-white text-lg">&times;</button>
    </div>
    <div id="sidebarHistory" class="flex-1 overflow-y-auto p-3 space-y-2"></div>
  </div>

  <!-- RIGHT PANEL — Sources -->
  <div id="sourcesPanel" class="sources-panel closed fixed right-0 top-0 h-full w-80 bg-[#111] border-l border-gray-800 z-40 flex flex-col">
    <div class="flex items-center justify-between p-4 border-b border-gray-800">
      <h2 class="text-sm font-bold text-gray-300">Sources</h2>
      <button onclick="toggleSources()" class="text-gray-500 hover:text-white text-lg">&times;</button>
    </div>
    <div id="sourcePanelCards" class="flex-1 overflow-y-auto p-3 space-y-3"></div>
  </div>

  <!-- Overlay for mobile -->
  <div id="overlay" class="hidden fixed inset-0 bg-black/50 z-30" onclick="toggleSidebar();toggleSources()"></div>

  <!-- MAIN CONTENT -->
  <div class="max-w-3xl mx-auto px-4 py-12">
    <!-- Top bar with history toggle -->
    <div class="flex items-center justify-between mb-8">
      <button onclick="toggleSidebar()" class="text-gray-500 hover:text-white text-sm flex items-center gap-1.5">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        History
      </button>
      <div class="text-center">
        <h1 class="text-3xl font-extrabold tracking-tight">Evidence Agent</h1>
        <p class="text-gray-500 text-sm">Voice-first claim verification</p>
      </div>
      <button onclick="toggleSources()" class="text-gray-500 hover:text-white text-sm flex items-center gap-1.5">
        Sources
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path d="M9 5l7 7-7 7"/></svg>
      </button>
    </div>

    <!-- Input area -->
    <div class="flex flex-col items-center gap-4 mb-10">
      <div class="relative w-full">
        <input
          id="claimInput"
          type="text"
          placeholder="Enter a claim to verify..."
          class="w-full bg-[#1A1A1A] border border-gray-700 rounded-xl px-5 py-4 text-lg focus:outline-none focus:border-blue-500 transition-colors pr-14"
        />
        <button
          id="micBtn"
          title="Push to talk"
          class="mic-btn absolute right-3 top-1/2 -translate-y-1/2 w-10 h-10 rounded-full bg-red-600 hover:bg-red-500 flex items-center justify-center transition-all"
        >
          <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
            <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5z"/>
            <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
          </svg>
        </button>
      </div>
      <button
        id="verifyBtn"
        class="bg-blue-600 hover:bg-blue-500 font-semibold text-lg px-8 py-3 rounded-xl transition-colors w-full sm:w-auto"
      >
        Verify Claim
      </button>
      <div class="flex flex-wrap gap-2 justify-center">
        <span class="text-xs text-gray-500">Try:</span>
        <button onclick="claimInput.value=this.textContent;verify()" class="text-xs text-blue-400 hover:text-blue-300 bg-blue-900/20 px-3 py-1 rounded-full hover:bg-blue-900/40 transition-colors">Coffee prevents heart disease</button>
        <button onclick="claimInput.value=this.textContent;verify()" class="text-xs text-blue-400 hover:text-blue-300 bg-blue-900/20 px-3 py-1 rounded-full hover:bg-blue-900/40 transition-colors">The Great Wall is visible from space</button>
        <button onclick="claimInput.value=this.textContent;verify()" class="text-xs text-blue-400 hover:text-blue-300 bg-blue-900/20 px-3 py-1 rounded-full hover:bg-blue-900/40 transition-colors">Humans only use 10% of their brain</button>
        <button onclick="claimInput.value=this.textContent;verify()" class="text-xs text-amber-400 hover:text-amber-300 bg-amber-900/20 px-3 py-1 rounded-full hover:bg-amber-900/40 transition-colors">Red wine in moderation is good for your heart</button>
        <button onclick="claimInput.value=this.textContent;verify()" class="text-xs text-amber-400 hover:text-amber-300 bg-amber-900/20 px-3 py-1 rounded-full hover:bg-amber-900/40 transition-colors">AI will replace most white-collar jobs within 5 years</button>
        <button onclick="claimInput.value=this.textContent;verify()" class="text-xs text-amber-400 hover:text-amber-300 bg-amber-900/20 px-3 py-1 rounded-full hover:bg-amber-900/40 transition-colors">Intermittent fasting extends lifespan</button>
      </div>
    </div>

    <!-- Status -->
    <div id="status" class="text-center text-gray-400 mb-8 hidden">
      <div class="inline-flex items-center gap-2">
        <svg class="animate-spin w-5 h-5" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
        </svg>
        <span id="statusText">Analyzing claim...</span>
      </div>
    </div>

    <!-- Verdict banner -->
    <div id="verdict" class="hidden mb-8 rounded-2xl p-6 relative">
      <!-- Top-right actions -->
      <div class="absolute top-3 right-3 flex items-center gap-2">
        <button onclick="newClaim()" class="text-xs text-gray-400 hover:text-white bg-white/10 hover:bg-white/20 px-3 py-1.5 rounded-lg transition-colors">Ask Another</button>
        <button onclick="discardClaim()" class="text-xs text-red-400 hover:text-red-300 bg-red-900/20 hover:bg-red-900/40 px-3 py-1.5 rounded-lg transition-colors">Discard</button>
      </div>

      <p id="verdictClaim" class="text-xs text-white/50 mb-2 italic"></p>
      <div class="text-sm font-medium uppercase tracking-widest mb-1 opacity-70">Verdict</div>
      <div class="flex items-center justify-center gap-3">
        <div id="verdictLabel" class="text-3xl font-extrabold mb-2"></div>
        <button
          id="speakerBtn"
          title="Replay verdict"
          onclick="if(currentAudio){currentAudio.pause();currentAudio=null;this.classList.remove('playing')}else{speakText(document.getElementById('verdictSummary').dataset.narration)}"
          class="speaker-btn w-8 h-8 rounded-full bg-white/10 hover:bg-white/20 flex items-center justify-center transition-all mb-2"
        >
          <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
          </svg>
        </button>
      </div>
      <div class="flex items-center justify-center gap-2 mb-3">
        <span class="text-sm opacity-70">Confidence</span>
        <div class="w-32 h-2 bg-black/20 rounded-full overflow-hidden">
          <div id="confidenceBar" class="h-full rounded-full transition-all duration-700"></div>
        </div>
        <span id="confidenceNum" class="text-sm font-semibold"></span>
      </div>
      <p id="verdictSummary" class="text-sm opacity-80 max-w-xl mx-auto mb-4"></p>

      <!-- Voice selector + powered by -->
      <div class="flex items-center justify-center gap-4 mb-3">
        <span class="text-[10px] text-gray-600 uppercase tracking-wider">Voice:</span>
        <div class="flex gap-1.5">
          <button onclick="setVoice('rachel','Rachel')" class="voice-option text-[10px] text-gray-400 px-2.5 py-1 rounded-md border border-gray-700" id="voice-rachel">Rachel</button>
          <button onclick="setVoice('George','George')" class="voice-option text-[10px] text-gray-400 px-2.5 py-1 rounded-md border border-gray-700" id="voice-George">George 🇬🇧</button>
          <button onclick="setVoice('Josh','Josh')" class="voice-option text-[10px] text-gray-400 px-2.5 py-1 rounded-md border border-gray-700" id="voice-Josh">Josh</button>
        </div>
      </div>
      <div class="text-center">
        <span class="text-[10px] text-gray-600">Powered by</span>
        <span class="text-[10px] text-gray-400 font-semibold ml-1">ElevenLabs</span>
        <span class="text-[10px] text-gray-600 mx-1">×</span>
        <span class="text-[10px] text-gray-400 font-semibold">Firecrawl</span>
      </div>

      <!-- Share buttons -->
      <div class="mt-4 flex flex-wrap items-center justify-center gap-2">
        <button onclick="copyVerdict()" class="text-xs text-gray-400 hover:text-white bg-white/5 hover:bg-white/10 px-4 py-2 rounded-lg transition-colors inline-flex items-center gap-1.5">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h12a2 2 0 002-2v-2M16 3h5v5M10 14L20.2 3.8"/></svg>
          <span id="shareBtnText">Copy</span>
        </button>
        <button onclick="shareToX()" class="text-xs text-gray-400 hover:text-white bg-white/5 hover:bg-white/10 px-4 py-2 rounded-lg transition-colors inline-flex items-center gap-1.5">
          <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
          X
        </button>
        <button onclick="shareToLinkedIn()" class="text-xs text-gray-400 hover:text-white bg-white/5 hover:bg-white/10 px-4 py-2 rounded-lg transition-colors inline-flex items-center gap-1.5">
          <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
          LinkedIn
        </button>
        <button onclick="shareToEmail()" class="text-xs text-gray-400 hover:text-white bg-white/5 hover:bg-white/10 px-4 py-2 rounded-lg transition-colors inline-flex items-center gap-1.5">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
          Email
        </button>
      </div>
    </div>

    <!-- Sources summary (inline, opens panel) -->
    <div id="sources" class="hidden">
      <button onclick="toggleSources()" class="w-full text-left bg-[#1A1A1A] border border-gray-800 rounded-xl px-5 py-4 hover:border-gray-600 transition-colors">
        <div class="flex items-center justify-between">
          <div>
            <h3 class="text-sm font-bold text-gray-300">Sources Found</h3>
            <p id="sourceCount" class="text-xs text-gray-500">Click to view details →</p>
          </div>
          <svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path d="M9 5l7 7-7 7"/></svg>
        </div>
      </button>
    </div>

    <!-- Follow-up Q&A -->
    <div id="followup" class="hidden mt-8">
      <h2 class="text-xl font-bold mb-4">Ask a follow-up</h2>
      <div class="flex gap-2">
        <input
          id="followupInput"
          type="text"
          placeholder="Ask about the evidence..."
          class="flex-1 bg-[#1A1A1A] border border-gray-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-blue-500 transition-colors"
        />
        <button
          id="followupBtn"
          onclick="askFollowup()"
          class="bg-blue-600 hover:bg-blue-500 font-semibold text-sm px-5 py-3 rounded-xl transition-colors shrink-0"
        >Ask</button>
      </div>
      <div id="followupAnswers" class="mt-4 space-y-3"></div>
    </div>

    <!-- Old history section hidden (replaced by sidebar) -->
    <div id="history" class="hidden">
      <div id="historyList"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
